settings:
  auto_inference_enabled: true
  fuzzy_matching_enabled: true
  profile_values: true
  max_candidates_per_table: 20
  minimum_match_rate: 0.50

table_overrides:
  sample_dim_market:
    auto_inference_enabled: false

dimensions:
  brand:
    enabled: true
    table: your-gcp-project.analytics.dim_brand
    description: Approved organizational brand dimension.
    keys:
      - parent_columns: [brand_sid]
        child_column_sets:
          - [brand_sid]
          - [brand_key]
      - parent_columns: [brand_id]
        child_column_sets:
          - [brand_id]
      - parent_columns: [brand_code]
        child_column_sets:
          - [brand_code]
    parent_filters:
      - {column: active_indicator, operator: eq, value: true}

  market:
    enabled: true
    table: your-gcp-project.analytics.dim_market
    description: Approved organizational market dimension.
    keys:
      - parent_columns: [market_sid]
        child_column_sets:
          - [market_sid]
      - parent_columns: [market_id]
        child_column_sets:
          - [market_id]
      - parent_columns: [market_code]
        child_column_sets:
          - [market_code]

  channel:
    enabled: true
    table: your-gcp-project.analytics.dim_channel
    description: Channel dimension with an intentionally ambiguous sample alias.
    keys:
      - parent_columns: [channel_sid]
        child_column_sets:
          - [channel_sid]
          - [channel_id]
      - parent_columns: [channel_id]
        child_column_sets:
          - [channel_id]
      - parent_columns: [channel_code]
        child_column_sets:
          - [channel_code]

custom_relationships:
  # RI1: every CC line must have at least one SKU child
  # child = cc table, parent = sku table keyed by cc_id — catches 50 orphan CCs
  - id: ri1_cc_has_sku_child
    enabled: true
    child_table: ri1_cc_sku
    child_columns: [destination_purchase_order_line_cc_id]
    parent_table: local.target.fact_dpo_line_sku
    parent_columns: [destination_purchase_order_line_cc_id]
    description: Every CC purchase order line must have at least one SKU child row.
    publish_to_context: false

  # RI2: every finished_good_color_sid must appear in dim_customer_choice
  # child = dim_finished_good_color_ri, parent = dim_customer_choice (ri2 version)
  - id: ri2_fgcolor_referenced_by_cc
    enabled: true
    child_table: ri2_cc_fgcolor
    child_columns: [finished_good_color_sid]
    parent_table: local.target.dim_customer_choice_ri2
    parent_columns: [finished_good_color_sid]
    description: Every finished_good_color_sid must be referenced by at least one customer_choice.
    publish_to_context: false

  # RI3: every season_sid in dim_customer_choice must exist in dim_season
  - id: ri3_season_sid_exists
    enabled: true
    child_table: ri3_season
    child_columns: [season_sid]
    parent_table: local.target.dim_season
    parent_columns: [season_sid]
    description: Every season_sid referenced in dim_customer_choice must exist in dim_season.
    publish_to_context: false

  - id: sales_market_override
    enabled: true
    child_table: sample_fact_sales
    child_columns: [market_sid]
    parent_table: your-gcp-project.analytics.dim_market
    parent_columns: [market_sid]
    description: Explicit relationship that overrides the registry candidate for market_sid.
    publish_to_context: false

  - id: sales_market_composite
    enabled: true
    child_table: sample_fact_sales
    child_columns: [market_code, source_system]
    parent_table: your-gcp-project.analytics.dim_market
    parent_columns: [market_code, source_system]
    child_filters:
      - {column: transaction_status, operator: eq, value: POSTED}
    parent_filters:
      - {column: active_indicator, operator: eq, value: true}
    description: Explicit composite relationship; overrides automatic candidates for these child columns.
    publish_to_context: false
