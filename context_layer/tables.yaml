tables:
  sample_fact_sales:
    table_type: fact
    business_entity: sales_transaction
    aliases: [fact_sales]
    description: Sales transactions migrated from Databricks to BigQuery.
    primary_key:
      source: [sale_id]
      target: [sale_id]
    audit_columns:
      source: updated_at
      target: updated_at
    freshness_sla_minutes: 1440
    assumptions:
      - Posted sales amounts should be non-negative.
    known_source_systems: [ERP, BRANDING FOUNDATION]
    columns:
      sale_id:
        description: Unique sales transaction identifier.
        role: primary_key
        required: true
      sales_amount:
        description: Posted sales revenue amount.
        role: measure
        minimum: 0
      transaction_status:
        description: Sales transaction processing status.
        accepted_values: [POSTED, PENDING, CANCELLED]
      updated_at:
        description: Timestamp of the latest data update.
        role: audit
        required: true
    filters:
      source: []
      target: []
    scd2:
      enabled: false
  sample_dim_brand_scd2:
    table_type: dimension
    business_entity: brand
    aliases: [dim_brand, brand_dimension]
    description: Brand dimension with current and historical versions.
    primary_key:
      source: [brand_sid]
      target: [brand_sid]
    audit_columns:
      source: updated_at
      target: updated_at
    freshness_sla_minutes: 1440
    columns:
      brand_sid:
        description: Brand surrogate key.
        role: primary_key
        required: true
      active_indicator:
        description: Identifies the current SCD Type 2 brand record.
        accepted_values: [true, false]
      updated_at:
        description: Timestamp of the latest brand update.
        role: audit
    filters:
      source:
        - {column: source_system, operator: eq, value: BRANDING FOUNDATION}
      target:
        - {column: source_system, operator: eq, value: BRANDING FOUNDATION}
    scd2:
      enabled: true
      current_filter:
        source:
          - {column: active_indicator, operator: eq, value: true}
        target:
          - {column: active_indicator, operator: eq, value: true}

  sample_dim_market:
    table_type: dimension
    business_entity: market
    aliases: [dim_market, market_dimension]
    description: Simple market reference dimension.
    primary_key:
      source: [market_sid]
      target: [market_sid]
    audit_columns:
      source: updated_at
      target: updated_at
    freshness_sla_minutes: 1440
    columns:
      market_sid:
        description: Market surrogate key.
        role: primary_key
        required: true
      updated_at:
        description: Timestamp of the latest market update.
        role: audit
    filters:
      source: []
      target: []
    scd2:
      enabled: false

  sample_bq_only_table:
    table_type: reference
    business_entity: sample_record
    aliases: [new_bigquery_table]
    description: Example standalone BigQuery data-quality target.
    primary_key:
      target: [record_id]
    audit_columns:
      target: updated_at
    freshness_sla_minutes: 1440
    columns:
      record_id:
        description: Unique record identifier.
        role: primary_key
        required: true
      updated_at:
        description: Timestamp of the latest BigQuery update.
        role: audit
    filters:
      target: []
    scd2:
      enabled: false
