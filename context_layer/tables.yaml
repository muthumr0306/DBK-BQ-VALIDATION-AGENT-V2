  # --- GDP → GCP migration test cases ---

  gdp_inv_loc:
    publish_to_context: false
    description: >
      Inventory managed location dimension. GDP source has 1000 rows; GCP target has 960.
      The column location_name exists in GDP but is absent from the GCP schema.
      distinct(abbreviated_location_name) should match but is halved in GCP.
    allow_masked_samples_for_llm: false
    primary_key:
      source: [inventory_managed_location_id]
      target: [inventory_managed_location_id]
    audit_columns:
      source: updated_on
      target: update_dttm
    freshness_sla_minutes: 2880
    filters:
      source: []
      target: []
    scd2:
      enabled: false

  gdp_mc_cc:
    publish_to_context: false
    description: >
      Market-channel customer-choice flattened view (GDP) vs vw_mc_sku_flattened (GCP).
      GDP 2000 rows / GCP 1850 rows. Distinct customer_choice_id, universal_customer_choice_number
      collapse in GCP. class_id is 100% null in GCP.
    allow_masked_samples_for_llm: false
    primary_key:
      source: [market_channel_customer_choice_id]
      target: [market_channel_sku_id]
    freshness_sla_minutes: 2880
    filters:
      source: []
      target: []
    scd2:
      enabled: false

  gdp_mc_sku:
    publish_to_context: false
    description: >
      Market-channel SKU flattened view (GDP) vs vw_mc_customer_choice_flattened (GCP).
      Both 1500 rows. size_code present in GDP source but absent from GCP target schema.
    allow_masked_samples_for_llm: false
    primary_key:
      source: [market_channel_sku_id]
      target: [market_channel_customer_choice_id]
    freshness_sla_minutes: 2880
    filters:
