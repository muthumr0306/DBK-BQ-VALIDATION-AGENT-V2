    audit_columns:
      source: last_updated_date
      target: last_update_ts
    freshness_sla_minutes: 1440
    columns:
      SkuID:
        description: SKU identifier.
        role: primary_key
        required: true
      store_number:
        description: Store identifier.
        role: primary_key
        required: true
      fiscal_wk:
        description: Fiscal week number.
        role: primary_key
        required: true
      PlanType:
        description: Plan type (WP or OP).
        role: primary_key
        accepted_values: [WP, OP]
        required: true
      plan_quantity:
        description: Planned quantity.
        role: measure
        minimum: 0
      last_update_ts:
