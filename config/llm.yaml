# LLM configuration is mandatory. Switching provider/model must only require edits here.
backend: ollama
api_family: openai_compatible
model: gemma3:4b
endpoint: http://localhost:11434/v1
temperature: 0.0
max_output_tokens: 8192
project_env: GCP_PROJECT_ID
location: us-central1
timeout_seconds: 90
max_retries: 2
