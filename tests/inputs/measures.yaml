grain_checks:
  - grain_id: by_date
    pair_id: gdp_daily_inv
    grain_columns:
      source: [business_inventory_date]
      target: [business_inventory_date]
    distinct_columns:
      source: [universal_sku_number, location, enterprise_channel_number]
      target: [universal_sku_number, location_number, enterprise_channel_number]
    date_column:
      source: business_inventory_date
      target: business_inventory_date
    row_count_tolerance: 0
    distinct_tolerance: 0
    enabled: true
    severity: error
    approval_status: approved

  - grain_id: by_channel
    pair_id: shipping_segment_test
    grain_columns:
      source: [fulfillment_channel]
      target: [channel]
    distinct_columns:
      source: [order_id]
      target: [order_key]
    date_column:
      source: order_ts
      target: load_ts
    row_count_tolerance: 0
    distinct_tolerance: 0
    enabled: true
    severity: error
    approval_status: approved
