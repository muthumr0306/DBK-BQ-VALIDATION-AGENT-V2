settings:
  inference_enabled: true
  profile_values: true
  propose_inferred_for_reuse: false
  max_inferred_per_table: 8
  max_groupings_per_measure: 6
  maximum_group_cardinality: 500

diagnostics:
  maximum_steps_per_failure: 3
  maximum_llm_calls_per_failure: 1
  maximum_failed_samples: 50
  allowed_types:
    - date_distribution
    - aggregate_by_dimension
    - null_distribution

measures:
  - measure_id: plan_qty
    definition_type: measure
    pair_id: pass_test
    source_expression: plan_qty
    target_expression: plan_quantity
    business_name: Plan Quantity
    aggregation: sum
    tolerance_absolute: 0.0
    tolerance_percentage: 0.5
    enabled: true
    severity: error
    approval_status: approved
    publish_to_context: false

  - measure_id: plan_qty
    definition_type: measure
    pair_id: rowmismatch_test
    source_expression: plan_qty
    target_expression: plan_quantity
    business_name: Plan Quantity
    aggregation: sum
    tolerance_absolute: 0.0
    tolerance_percentage: 0.5
    enabled: true
    severity: error
    approval_status: approved
    publish_to_context: false

  - measure_id: plan_qty
    definition_type: measure
    pair_id: valuemismatch_test
    source_expression: plan_qty
    target_expression: plan_quantity
    business_name: Plan Quantity
    aggregation: sum
    tolerance_absolute: 0.0
    tolerance_percentage: 0.5
    enabled: true
    severity: error
    approval_status: approved
    publish_to_context: false

  - measure_id: total_sales
    definition_type: measure
    pair_id: sample_fact_sales
    # no source_table/target_table — matched by pair_id only so mock table names don't matter
    source_expression: sales_amount
    target_expression: sales_amount
    business_name: Total Sales
    description: Total posted sales amount. Target should be inflated by +15.00 (baked-in issue).
    aggregation: sum
    tolerance_absolute: 0.01
    tolerance_percentage: 0.5
    source_filters:
      - {column: transaction_status, operator: eq, value: POSTED}
    target_filters:
      - {column: transaction_status, operator: eq, value: POSTED}
    enabled: true
    severity: error
    approval_status: approved
    publish_to_context: false

  - measure_id: order_amount_total
    definition_type: measure
    pair_id: shipping_segment_test
    source_expression: order_amount
    target_expression: amt
    business_name: Total Order Amount
    aggregation: sum
    group_by:
      source: [fulfillment_channel]
      target: [channel]
    tolerance_absolute: 0.01
    tolerance_percentage: 0.5
    enabled: true
    severity: error
    approval_status: approved
    publish_to_context: false

  - measure_id: paid_amt_total
    definition_type: measure
    pair_id: paid_amt_test
    source_expression: paid_amt
    target_expression: paid_amt
    business_name: Total Paid Amount
    aggregation: sum
    tolerance_absolute: 0.01
    tolerance_percentage: 0.5
    enabled: true
    severity: error
    approval_status: approved
    publish_to_context: false
