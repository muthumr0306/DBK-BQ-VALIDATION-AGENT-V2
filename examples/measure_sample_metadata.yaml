tables:
  sample_fact_sales:
    source_table: main.sales.fact_sales
    target_table: your-gcp-project.analytics.fact_sales
    source:
      - {name: sale_id, data_type: BIGINT, nullable: false, description: Sale identifier}
      - {name: sales_amount, data_type: DECIMAL, nullable: true, description: Posted sales revenue amount}
      - {name: cost_amount, data_type: DECIMAL, nullable: true, description: Product cost amount}
      - {name: sales_date, data_type: DATE, nullable: false, description: Sales business date}
      - {name: brand_id, data_type: BIGINT, nullable: true, description: Brand identifier}
      - {name: market_id, data_type: BIGINT, nullable: true, description: Market identifier}
      - {name: source_system, data_type: STRING, nullable: false, description: Originating source system}
      - {name: transaction_status, data_type: STRING, nullable: false, description: Processing status}
    target:
      - {name: sale_id, data_type: INT64, nullable: false, description: Sale identifier}
      - {name: sales_amount, data_type: NUMERIC, nullable: true, description: Posted sales revenue amount}
      - {name: cost_amount, data_type: NUMERIC, nullable: true, description: Product cost amount}
      - {name: sales_date, data_type: DATE, nullable: false, description: Sales business date}
      - {name: brand_sid, data_type: INT64, nullable: true, description: Brand surrogate identifier}
      - {name: market_sid, data_type: INT64, nullable: true, description: Market surrogate identifier}
      - {name: source_system, data_type: STRING, nullable: false, description: Originating source system}
      - {name: transaction_status, data_type: STRING, nullable: false, description: Processing status}

  sample_fact_orders:
    source_table: main.sales.fact_orders
    target_table: your-gcp-project.analytics.fact_orders
    source:
      - {name: order_id, data_type: BIGINT, nullable: false, description: Order identifier}
      - {name: units_sold, data_type: BIGINT, nullable: true, description: Quantity of units sold}
      - {name: profit_margin, data_type: DECIMAL, nullable: true, description: Profit margin percentage KPI}
      - {name: channel_id, data_type: BIGINT, nullable: true, description: Channel identifier}
    target:
      - {name: order_id, data_type: INT64, nullable: false, description: Order identifier}
      - {name: units_sold, data_type: INT64, nullable: true, description: Quantity of units sold}
      - {name: profit_margin, data_type: NUMERIC, nullable: true, description: Profit margin percentage KPI}
      - {name: channel_sid, data_type: INT64, nullable: true, description: Channel surrogate identifier}

profiles:
